[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odds-aggregator"
version = "0.1.0"
description = "Cross-platform prediction market odds aggregator — Polymarket + Kalshi fuzzy matching + arb detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0","typer>=0.12.0","rich>=13.0.0","rapidfuzz>=3.0.0","pandas>=2.0.0","python-dotenv>=1.0.0","pydantic>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/odds"]
